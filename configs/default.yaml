dataset:
  # Stage1 默认多任务干净训练：DocVQA / InfoVQA / ChartQA 按 4:3:3 采样
  multi:
    - root: ./data_pipeline/data/docvqa
      type: docvqa
      split: train
      weight: 4
      apply_corruption: false
    - root: ./data_pipeline/data/infovqa
      type: infovqa
      split: train
      weight: 3
      apply_corruption: false
    - root: ./data_pipeline/data/chartqa
      type: chartqa
      split: train
      weight: 3
      apply_corruption: false
  eval_split: val
  batch_size: 1          # per-GPU batch，小显存下更稳
  num_workers: 2
  pseudo_corpus: ./artifacts/pseudo_text_all_train.jsonl   # 离线伪文本库（build_pseudo_text.py 输出）
model:
  name: ./models/Qwen3-VL-8B-Instruct   # 使用 8B 以追求 SOTA，需确保本地权重在此路径
  lora_rank: 8                # 降低 LoRA 尺寸以进一步节省显存
  lora_alpha: 16
  hidden_size: 4096
  bf16: false                 # V100 不支持 bf16
  vision_tokens: 6
  load_in_4bit: true          # 启用 4bit 量化，显著降低显存
  load_in_8bit: false
  device_map: auto            # 单进程下自动切分到可见 GPU，实现模型并行
  provider: huggingface  # 本地路径也用 huggingface provider
  token: null            # 使用本地模型，不需要 token
  cache_dir: ./hf_cache
  revision: null
  local_files_only: true
  retrieval_corpus_path: ./artifacts/pseudo_text_all_train.jsonl
  enable_corruption: false   # Stage1 关；Stage2A/2B 改为 true
  enable_retrieval: false    # Stage1 可关；Stage2A/2B 改为 true
  enable_prefix: true
  enable_memory: true
  enable_imputation: true
  enable_consistency: false  # Stage1 关；Stage2A/2B 改为 true 并调权重
  lambda_consistency: 0.3
  top_k: 3
training:
  epochs: 1
  log_interval: 10
  fp16: false            # 量化时关闭 fp16
  grad_accum_steps: 8    # 增大累积步，进一步降低显存峰值
  num_workers: 2
  learning_rate: 0.0002
  weight_decay: 0.05
  warmup_ratio: 0.05
evaluation:
  split: val
  apply_corruption: false
  batch_size: 2
