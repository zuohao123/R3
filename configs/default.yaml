dataset:
  # Stage1 默认多任务干净训练：DocVQA / InfoVQA / ChartQA 按 4:3:3 采样
  multi:
    - root: ./data_pipeline/data/docvqa
      type: docvqa
      split: train
      weight: 4
      apply_corruption: false
    - root: ./data_pipeline/data/infovqa
      type: infovqa
      split: train
      weight: 3
      apply_corruption: false
    - root: ./data_pipeline/data/chartqa
      type: chartqa
      split: train
      weight: 3
      apply_corruption: false
  eval_split: val
  batch_size: 1          # 8×V100 DDP 安全起步（单卡不 OOM）；如显存富余再逐步加到 2
  num_workers: 2
  pseudo_corpus: ./artifacts/pseudo_text_all_train.jsonl   # 离线伪文本库（build_pseudo_text.py 输出）
model:
  name: ./models/Qwen3-VL-8B-Instruct   # 使用 8B 以追求 SOTA，需确保本地权重在此路径
  lora_rank: 8                # 降低 LoRA 尺寸以进一步节省显存
  lora_alpha: 16
  hidden_size: 4096
  bf16: false                 # V100 不支持 bf16
  dtype: fp16                 # 与基座/评测一致：fp16 权重，避免 DDP 单卡 OOM
  vision_tokens: 64           # 对齐官方长视觉序列
  load_in_4bit: false         # 关闭量化，避免精度差异
  load_in_8bit: false
  device_map: auto            # torchrun DDP 下 local_rank 会映射到对应 GPU
  gradient_checkpointing: false
  low_cpu_mem_usage: true
  provider: huggingface  # 本地路径也用 huggingface provider
  token: null            # 使用本地模型，不需要 token
  cache_dir: ./hf_cache
  revision: null
  local_files_only: true
  retrieval_corpus_path: ./artifacts/pseudo_text_all_train.jsonl
  enable_corruption: false   # Stage1 关；Stage2A/2B 改为 true
  enable_retrieval: false    # Stage1 可关；Stage2A/2B 改为 true
  enable_prefix: true
  enable_memory: true
  enable_imputation: true
  enable_consistency: false  # Stage1 关；Stage2A/2B 改为 true 并调权重
  lambda_consistency: 0.3
  top_k: 3
training:
  epochs: 1
  log_interval: 10
  fp16: true             # 开启 AMP（fp16 计算 + fp32 可训练参数），更快且显存更省
  grad_accum_steps: 4    # 8卡下全局 batch≈32（1×8×4）；如 batch=2 可改为 2
  grad_checkpoint: false # 默认关闭；若仍 OOM 再开启
  use_chat_template: true
  lr_lora_mult: 1.0
  lr_r3_mult: 1.0
  report_to: tensorboard
  logging_dir: ./checkpoints/runs_default
  num_workers: 2
  learning_rate: 0.00008
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
evaluation:
  split: val
  apply_corruption: false
  batch_size: 1              # 避免长视觉/全精评测时 OOM
