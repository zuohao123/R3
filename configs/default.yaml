dataset:
  # Stage1 默认多任务干净训练：DocVQA / InfoVQA / ChartQA 按 4:3:3 采样
  multi:
    - root: ./data_pipeline/data/docvqa
      type: docvqa
      split: train
      weight: 4
      apply_corruption: false
    - root: ./data_pipeline/data/infovqa
      type: infovqa
      split: train
      weight: 3
      apply_corruption: false
    - root: ./data_pipeline/data/chartqa
      type: chartqa
      split: train
      weight: 3
      apply_corruption: false
  eval_split: val
  batch_size: 2
  num_workers: 4
  pseudo_corpus: ./artifacts/pseudo_text_all_train.jsonl   # 离线伪文本库（build_pseudo_text.py 输出）
model:
  name: Qwen/Qwen3-VL-8B-Instruct
  lora_rank: 32
  lora_alpha: 16
  hidden_size: 4096
  provider: modelscope  # 可切换为 modelscope huggingface
  token: ms-0d4f55e3-62c7-4e90-832e-9f864f802305            # 私有模型可填 HF token 或魔搭 token
  cache_dir: ./hf_cache
  revision: null
  local_files_only: false
  retrieval_corpus_path: ./artifacts/pseudo_text_all_train.jsonl
  enable_corruption: false   # Stage1 关；Stage2A/2B 改为 true
  enable_retrieval: false    # Stage1 可关；Stage2A/2B 改为 true
  enable_prefix: true
  enable_memory: true
  enable_imputation: true
  enable_consistency: false  # Stage1 关；Stage2A/2B 改为 true 并调权重
  lambda_consistency: 0.3
  top_k: 3
training:
  epochs: 1
  log_interval: 10
  learning_rate: 0.0002
  weight_decay: 0.05
  warmup_ratio: 0.05
evaluation:
  split: val
  apply_corruption: false
  batch_size: 2
