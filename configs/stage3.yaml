dataset:
  # Stage3 重度 PMC：更高腐蚀/一致性权重
  multi:
    - root: ./data_pipeline/data/docvqa
      type: docvqa
      split: train
      weight: 4
      apply_corruption: true
      corruption_prob: 0.85
      pseudo_text_drop_prob: 0.4
      pseudo_text_max_items: 8
      pseudo_text_max_chars: 64
      image_corruption:
        occlusion_prob: 0.7
        occlusion_ratio: 0.35
        blur_prob: 0.7
        blur_radius: 4.5
    - root: ./data_pipeline/data/infovqa
      type: infovqa
      split: train
      weight: 3
      apply_corruption: true
      corruption_prob: 0.85
      pseudo_text_drop_prob: 0.4
      pseudo_text_max_items: 8
      pseudo_text_max_chars: 64
      image_corruption:
        occlusion_prob: 0.7
        occlusion_ratio: 0.35
        blur_prob: 0.7
        blur_radius: 4.5
    - root: ./data_pipeline/data/chartqa
      type: chartqa
      split: train
      weight: 3
      apply_corruption: true
      corruption_prob: 0.85
      pseudo_text_drop_prob: 0.4
      pseudo_text_max_items: 8
      pseudo_text_max_chars: 64
      image_corruption:
        occlusion_prob: 0.7
        occlusion_ratio: 0.35
        blur_prob: 0.7
        blur_radius: 4.5
  eval_split: val
  batch_size: 4        # 单进程模型并行：每步 4 条；配合 grad_accum=2 形成有效 8
  num_workers: 2
  pseudo_corpus: ./artifacts/pseudo_text_all_train.jsonl
model:
  name: ./models/Qwen3-VL-8B-Instruct
  lora_rank: 8
  lora_alpha: 16
  hidden_size: 4096
  bf16: false
  dtype: fp16
  vision_tokens: 64
  load_in_4bit: false
  load_in_8bit: false
  device_map: auto           # torchrun 下 local_rank 映射单卡
  gradient_checkpointing: false
  low_cpu_mem_usage: true
  provider: huggingface
  token: null
  cache_dir: ./hf_cache
  revision: null
  local_files_only: true
  max_seq_length: 8192        # 加长序列，降低答案被截断风险
  retrieval_corpus_path: null        # Stage3 默认仍禁用跨文档检索，必要时再开启
  enable_corruption: true
  enable_retrieval: true
  enable_prefix: true
  enable_memory: true
  enable_imputation: true
  enable_consistency: true
  lambda_consistency: 0.4     # 略降，避免一致性过重拖慢收敛
  consistency_start_step: 500
  consistency_ramp_steps: 1500
  top_k: 3
training:
  epochs: 1
  log_interval: 10
  fp16: true
  grad_accum_steps: 2        # batch=4, grad_accum=2 => 有效 8 样本/step
  grad_checkpoint: false       # 模型并行下保持关闭，避免 reentrant 报错
  use_chat_template: true
  lr_lora_mult: 0.3
  lr_r3_mult: 2.0
  report_to: tensorboard
  logging_dir: ./checkpoints/runs_stage3
  num_workers: 2
  learning_rate: 0.00003    # 可按需微调到 2.5e-5 若不稳
  weight_decay: 0.01
  warmup_ratio: 0.1         # 增大 warmup，平滑前期
  lr_scheduler_type: cosine
evaluation:
  split: val
  apply_corruption: true
  batch_size: 1
