dataset:
  # Stage3 重度 PMC：更高腐蚀/一致性权重
  multi:
    - root: ./data_pipeline/data/docvqa
      type: docvqa
      split: train
      weight: 4
      apply_corruption: true
      pseudo_text_drop_prob: 0.35
      image_corruption:
        occlusion_prob: 0.6
        occlusion_ratio: 0.3
        blur_prob: 0.6
        blur_radius: 3.5
    - root: ./data_pipeline/data/infovqa
      type: infovqa
      split: train
      weight: 3
      apply_corruption: true
      pseudo_text_drop_prob: 0.35
      image_corruption:
        occlusion_prob: 0.6
        occlusion_ratio: 0.3
        blur_prob: 0.6
        blur_radius: 3.5
    - root: ./data_pipeline/data/chartqa
      type: chartqa
      split: train
      weight: 3
      apply_corruption: true
      pseudo_text_drop_prob: 0.35
      image_corruption:
        occlusion_prob: 0.6
        occlusion_ratio: 0.3
        blur_prob: 0.6
        blur_radius: 3.5
  eval_split: val
  batch_size: 1
  num_workers: 2
  pseudo_corpus: ./artifacts/pseudo_text_all_train.jsonl
model:
  name: ./models/Qwen3-VL-8B-Instruct
  lora_rank: 8
  lora_alpha: 16
  hidden_size: 4096
  bf16: false
  vision_tokens: 64
  load_in_4bit: false
  load_in_8bit: false
  device_map: auto           # torchrun 下 local_rank 映射单卡
  gradient_checkpointing: false
  low_cpu_mem_usage: true
  provider: huggingface
  token: null
  cache_dir: ./hf_cache
  revision: null
  local_files_only: true
  retrieval_corpus_path: ./artifacts/pseudo_text_all_train.jsonl
  enable_corruption: true
  enable_retrieval: true
  enable_prefix: true
  enable_memory: true
  enable_imputation: true
  enable_consistency: true
  lambda_consistency: 0.5     # 重度阶段适度提高一致性权重
  top_k: 3
training:
  epochs: 1
  log_interval: 10
  fp16: false
  grad_accum_steps: 16        # batch=1 时累积控制显存
  grad_checkpoint: false       # 先关闭以规避 dtype/backward 问题
  report_to: tensorboard
  logging_dir: ./checkpoints/runs_stage3
  num_workers: 2
  learning_rate: 0.00003
  weight_decay: 0.01
  warmup_ratio: 0.05
evaluation:
  split: val
  apply_corruption: true
  batch_size: 1
